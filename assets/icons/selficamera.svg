<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep circular base -->
  <circle cx="128" cy="128" r="118" fill="url(#bgGrad)"/>

  <!-- Glowing Voice Aura Ring -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="url(#auraGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Inner Camera Housing -->
  <circle cx="128" cy="128" r="82" fill="url(#lensGrad)" stroke="#45475a" stroke-width="3"/>

  <!-- Camera Lens Outer Rim -->
  <circle cx="128" cy="128" r="62" fill="#181825" stroke="#585b70" stroke-width="2"/>

  <!-- Aperture / Person Presenter Silhouette in Lens -->
  <!-- Head -->
  <circle cx="128" cy="108" r="22" fill="#cdd6f4"/>
  <!-- Torso -->
  <path d="M 88 158 C 88 136, 168 136, 168 158 Z" fill="#89b4fa"/>

  <!-- Recording Lens Glint / Status Dot -->
  <circle cx="152" cy="94" r="5" fill="#a6e3a1"/>
  <circle cx="104" cy="94" r="3" fill="#ffffff" opacity="0.7"/>
</svg>

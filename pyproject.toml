[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "selficamera"
version = "0.1.0"
description = "Lightweight, zero-bloat, offline circular presenter camera overlay for Ubuntu Linux"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SelfiCamera Team"}
]
dependencies = [
    "PySide6-Essentials>=6.6.0",
    "opencv-python-headless>=4.8.0,<5.0",
    "onnxruntime>=1.16.0",
    "numpy>=1.24.0",
    "sounddevice>=0.4.6",
    "python-xlib>=0.33",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-mock>=3.12.0",
    "onnx>=1.14.0",
]

[project.scripts]
selficamera = "selficamera.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["selficamera*"]
